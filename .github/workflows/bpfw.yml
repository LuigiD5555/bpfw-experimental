name: BPFW Verify

on:
  pull_request:
  push:
    branches:
      - main
      - mvp-inspector-editor-planner

jobs:
  bpfw-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run BPFW verify
        run: bpfw verify
