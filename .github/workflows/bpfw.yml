name: BPFW Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bpfw-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run BPFW verify in CI mode
        env:
          BPFW_MANIFEST_HMAC_KEY: ${{ secrets.BPFW_MANIFEST_HMAC_KEY }}
          BPFW_ACCESS_HMAC_KEY: ${{ secrets.BPFW_ACCESS_HMAC_KEY }}
          BPFW_APPROVAL_HMAC_KEY: ${{ secrets.BPFW_APPROVAL_HMAC_KEY }}
        run: bpfw verify --ci
