version: 1

responsibilities:
  - responsibility_id: query_execution
    canonical_name: QueryExecution
    owner_layer: application
    lifecycle_state: active
    allowed_files:
      - src/application/query/query_service.py
    allowed_symbols:
      - QueryService.execute
    allowed_implementations:
      - implementation_id: default_query_execution
        class_name: QueryService
        file: src/application/query/query_service.py
        lifecycle_state: active
        replacement_id: null
        disabled_reason: null
        removal_plan: null
      - implementation_id: optimized_query_execution
        class_name: OptimizedQueryService
        file: src/application/query/optimized_query_service.py
        lifecycle_state: experimental
        replacement_id: default_query_execution
        disabled_reason: null
        removal_plan: null
    active_implementation: default_query_execution
    forbidden_duplicates:
      - SmartQueryManager
    mutability: editable
    owner: project_owner

locked_resources:
  - resource_id: project_blueprint
    path: blueprint.yaml
    mutability: locked
    owner: project_owner
