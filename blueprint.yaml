version: 1
responsibilities:
- responsibility_id: query_execution
  canonical_name: QueryExecution
  owner_layer: application
  lifecycle_state: active
  allowed_files:
  - src/application/query/query_service.py
  - src/application/query/retry_policy.py
  allowed_symbols:
  - QueryService.execute
  - RetryPolicy
  - __init__
  - should_retry
  allowed_implementations:
  - implementation_id: default_query_execution
    class_name: QueryService
    file: src/application/query/query_service.py
    lifecycle_state: active
    replacement_id: null
    disabled_reason: null
    removal_plan: null
  - implementation_id: optimized_query_execution
    class_name: OptimizedQueryService
    file: src/application/query/optimized_query_service.py
    lifecycle_state: experimental
    replacement_id: default_query_execution
    disabled_reason: null
    removal_plan: null
  - implementation_id: disabled_query_execution
    class_name: DisabledQueryService
    file: src/application/query/disabled_query_service.py
    lifecycle_state: disabled
    replacement_id: default_query_execution
    disabled_reason: Safety fallback implementation must not run in runtime
    removal_plan: Replace runtime binding with default_query_execution before release
  - implementation_id: deprecated_query_execution
    class_name: DeprecatedQueryService
    file: src/application/query/deprecated_query_service.py
    lifecycle_state: deprecated
    replacement_id: default_query_execution
    disabled_reason: null
    removal_plan: Migrate all callers to default_query_execution
  - implementation_id: retrypolicy_planned
    class_name: RetryPolicy
    file: src/application/query/retry_policy.py
    lifecycle_state: planned
    replacement_id: default_query_execution
    disabled_reason: null
    removal_plan: null
  active_implementation: default_query_execution
  forbidden_duplicates:
  - SmartQueryManager
  mutability: editable
  owner: project_owner
locked_resources:
- resource_id: project_blueprint
  path: blueprint.yaml
  mutability: locked
  owner: project_owner
