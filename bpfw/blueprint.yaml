      kind: function
      methods: []
      functions: []
      imports: []
      decorators: []
      docstring: Entry point for BPFW MVP CLI.
      signature: main()
    entrypoints: []
    related_code: []
    duplicate_policy:
      group: null
      allow_multiple_non_active: true
      forbidden_active_duplicates: true
      suspected_duplicates: []
    replacement:
      replaces: null
      replaced_by: null
      reason: null
    notes: null
