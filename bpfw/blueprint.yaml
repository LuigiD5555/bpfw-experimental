version: 1
project:
  id: blueprint_framework
  name: blueprint-framework
  root: .
  language: python
  source_roots:
  - src
  ignored_paths:
  - .git
  - .venv
  - venv
  - __pycache__
  - node_modules
  - tests
  - migrations
policy:
  mode: catalog
  empty_blueprint_allows_execution: true
  defined_blueprint_blocks_on_drift: true
  allowed_lifecycles:
  - active
  - experimental
  - legacy
  - deprecated
  single_active_per_intent: true
  undeclared_code_blocks: true
  missing_declared_code_blocks: true
  security:
    no_secrets_in_blueprint: true
    public_safe_mode: true
    detected_detail_level: minimal
