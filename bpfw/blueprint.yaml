    methods: []
    functions: []
    imports:
    - typing.Any
    - typing.Dict
    - typing.List
    - typing.Set
    - typing.Tuple
    - bpfw.catalog.models.AUTHORITY_STATE_DEFINED
    - bpfw.catalog.models.DiscoveredCodeUnit
    - bpfw.reports.finding.FINDING_SEVERITY_BLOCK
    - bpfw.reports.finding.Finding
    decorators: []
    docstring: "Compare declared responsibilities against discovered code units.\n\
      \nDrift only runs when the blueprint is in the ``defined`` state.  For all\n\
      other states (``missing``, ``empty``, ``invalid``, ``draft``) the\nfunction\
      \ returns an empty list — validation handles those cases.\n\nMatching uses the\
      \ exact composite key ``path + symbol + symbol_type``.\nNo rename detection,\
      \ no semantic duplicate inference, no lifecycle\ninspection, and no file scanning\
      \ is performed here.\n\nParameters\n----------\nblueprint_data:\n    Parsed\
      \ YAML content of the blueprint file.\ndiscovered_units:\n    Code units discovered\
      \ by the AST scanner.\nauthority_state:\n    One of the ``AUTHORITY_STATE_*``\
      \ constants.\n\nReturns\n-------\nlist[Finding]\n    Drift findings (``MISSING_DECLARED_CODE``\
      \ and/or\n    ``UNDECLARED_CODE``)."
    signature: compare_declared_to_discovered(blueprint_data, discovered_units, authority_state)
      -> List[Finding]
