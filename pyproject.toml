[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-framework"
version = "0.3.0"
description = "Intent-preserving system verification and change gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0", "prompt-toolkit>=3.0", "pydantic>=2.7", "watchfiles>=0.21"]

[project.optional-dependencies]
qa = ["pytest>=9.0", "pytest-cov>=7.0", "coverage>=7.13", "hypothesis>=6.0", "pytest-readable>=0.2,<0.3"]
multilang = ["tree-sitter<0.26,>=0.25", "tree-sitter-go<0.26,>=0.25", "tree-sitter-rust<0.25,>=0.24", "tree-sitter-html<0.24,>=0.23", "tree-sitter-css<0.26,>=0.25"]

[project.scripts]
bpfw = "bpfw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bpfw*"]
exclude = ["bpfw._runtime*"]
namespaces = true

[tool.setuptools.package-data]
bpfw = ["py.typed", "**/*.json", "**/*.toml", "_runtime/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
