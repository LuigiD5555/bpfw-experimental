[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-framework"
version = "0.1.0"
description = "Blueprint Framework (BPFW) - MVP catalog control framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Blueprint Framework Contributors"}
]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
bpfw = "bpfw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpfw = ["hooks/pre-commit", "hooks/pre-push"]
